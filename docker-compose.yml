services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app                          # your code, live-synced into the container
      - node_modules:/app/node_modules  # container keeps its own dependencies
    environment:
      - VITE_API_URL=http://localhost/api/v1

volumes:
  node_modules: